name: Build visual alpha source

on:
  push:
    paths:
      - "EYRAX-Real-Roosters-0.3.0-alpha.7-v16-source.zip"
      - ".github/workflows/build-visual-alpha.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Unpack visual source
        run: |
          echo 'e9bf4fd24a2cdd385be5e080cfaab99a66437327499d9f38bf1908ce1273ce4a  EYRAX-Real-Roosters-0.3.0-alpha.7-v16-source.zip' | sha256sum --check
          mkdir visual-src
          unzip -q EYRAX-Real-Roosters-0.3.0-alpha.7-v16-source.zip -d visual-src
          test -f visual-src/build.gradle
          test -f visual-src/src/main/resources/assets/eyrax_real_roosters/geo/heritage_chicken.geo.json

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0 matplotlib==3.10.6

      - name: Validate assets and release structure
        working-directory: visual-src
        run: |
          python3 tools/validate_gecko_assets.py
          python3 tools/validate_render_budget.py
          python3 tools/validate_release_structure.py
          python3 tools/validate_visual_polish.py

      - name: Build API and mod
        working-directory: visual-src
        run: gradle build --stacktrace --no-daemon

      - name: Dedicated server smoke test
        working-directory: visual-src
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          setsid gradle runServer --no-daemon > server-smoke.log 2>&1 &
          server_pid=$!
          started=0
          for attempt in $(seq 1 90); do
            if grep -q 'Done (' server-smoke.log; then
              started=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          kill -TERM -- "-$server_pid" 2>/dev/null || true
          sleep 3
          kill -KILL -- "-$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          if [ "$started" -ne 1 ]; then
            tail -n 250 server-smoke.log
            exit 1
          fi
          if grep -Eqi 'Mod loading has failed|FATAL|Failed to start' server-smoke.log; then
            tail -n 250 server-smoke.log
            exit 1
          fi
          grep 'Done (' server-smoke.log | tail -1

      - name: Minecraft client visual regression
        working-directory: visual-src
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          test -f run/world/level.dat
          mkdir -p run/saves
          cp -a run/world run/saves/AnalyzerVisualQA
          cat > run/options.txt <<'OPTIONS'
          lang:es_es
          guiScale:2
          renderDistance:3
          simulationDistance:3
          maxFps:30
          enableVsync:false
          pauseOnLostFocus:false
          onboardAccessibility:false
          menuBackgroundBlurriness:5
          tutorialStep:none
          OPTIONS
          if ! xvfb-run -a -s "-screen 0 1280x960x24" timeout 240s gradle runClient -Peyrax.visualQa=true --no-configuration-cache --no-daemon > client-visual-qa.log 2>&1; then
            tail -n 250 client-visual-qa.log
            exit 1
          fi
          grep 'EYRAX_VISUAL_QA_SUCCESS' client-visual-qa.log
          test -f run/visual-qa/00-alpha6-blurred.png
          test -f run/visual-qa/01-alpha7-fixed.png
          test -f run/visual-qa/02-alpha7-compact.png
          test -f run/visual-qa/03-alpha7-compact-scrolled.png

      - name: Inspect JAR separation
        working-directory: visual-src
        run: |
          test -f build/libs/eyrax-fowl-api-1.0.0.jar
          test -f build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar
          jar tf build/libs/eyrax-fowl-api-1.0.0.jar | grep -q '^com/eyrax/fowlapi/'
          if jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar | grep -q '^com/eyrax/fowlapi/'; then
            echo "Fowl API classes leaked into the main JAR"
            exit 1
          fi
          jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar | grep -q 'assets/eyrax_real_roosters/geo/heritage_chicken.geo.json'
          jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar | grep -q 'assets/eyrax_real_roosters/animations/heritage_chicken.animation.json'
          jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar | grep -q 'META-INF/neoforge.mods.toml'
          unzip -p build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar META-INF/neoforge.mods.toml | grep -q 'modId="eyrax_fowl_api"'
          unzip -p build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar META-INF/neoforge.mods.toml | grep -q 'modId="geckolib"'
          if unzip -Z1 build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar | grep -Eq '^assets/examplemod/|^data/minecraft/tags/entity_type/'; then
            echo "Placeholder resources leaked into the main JAR"
            exit 1
          fi
          if jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar | grep -Eq '^com/eyrax/visualqa/|BlurredBaselineScreen'; then
            echo "Development-only QA classes leaked into the main JAR"
            exit 1
          fi
          sha256sum build/libs/eyrax-fowl-api-1.0.0.jar build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar
          unzip -t build/libs/eyrax-fowl-api-1.0.0.jar
          unzip -t build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar
          ls -lh build/libs/*.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EYRAX-Real-Roosters-0.3.0-alpha.7-visual-qa
          path: |
            visual-src/run/visual-qa/*.png
            visual-src/client-visual-qa.log
            visual-src/server-smoke.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: EYRAX-Real-Roosters-0.3.0-alpha.7-build
          path: |
            visual-src/build/libs/eyrax-fowl-api-1.0.0.jar
            visual-src/build/libs/eyrax_real_roosters-0.3.0-alpha.7.jar
          if-no-files-found: error
