name: Build visual alpha source

on:
  push:
    paths:
      - "EYRAX-Real-Roosters-GeckoLib-migration-checkpoint-2026-09-05-v14.zip"
      - ".github/workflows/build-visual-alpha.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Unpack visual source
        run: |
          mkdir visual-src
          unzip -q EYRAX-Real-Roosters-GeckoLib-migration-checkpoint-2026-09-05-v14.zip -d visual-src
          test -f visual-src/build.gradle
          test -f visual-src/src/main/resources/assets/eyrax_real_roosters/geo/heritage_chicken.geo.json

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0 matplotlib==3.10.6

      - name: Validate assets and release structure
        working-directory: visual-src
        run: |
          python3 tools/validate_gecko_assets.py
          python3 tools/validate_render_budget.py
          python3 tools/validate_release_structure.py

      - name: Build API and mod
        working-directory: visual-src
        run: gradle build --stacktrace --no-daemon

      - name: Dedicated server smoke test
        working-directory: visual-src
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          setsid gradle runServer --no-daemon > server-smoke.log 2>&1 &
          server_pid=$!
          started=0
          for attempt in $(seq 1 90); do
            if grep -q 'Done (' server-smoke.log; then
              started=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          kill -TERM -- "-$server_pid" 2>/dev/null || true
          sleep 3
          kill -KILL -- "-$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          if [ "$started" -ne 1 ]; then
            tail -n 250 server-smoke.log
            exit 1
          fi
          if grep -Eqi 'Mod loading has failed|FATAL|Failed to start' server-smoke.log; then
            tail -n 250 server-smoke.log
            exit 1
          fi
          grep 'Done (' server-smoke.log | tail -1

      - name: Inspect JAR separation
        working-directory: visual-src
        run: |
          test -f build/libs/eyrax-fowl-api-1.0.0.jar
          test -f build/libs/eyrax_real_roosters-0.3.0-alpha.5.jar
          jar tf build/libs/eyrax-fowl-api-1.0.0.jar | grep -q '^com/eyrax/fowlapi/'
          if jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.5.jar | grep -q '^com/eyrax/fowlapi/'; then
            echo "Fowl API classes leaked into the main JAR"
            exit 1
          fi
          jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.5.jar | grep -q 'assets/eyrax_real_roosters/geo/heritage_chicken.geo.json'
          jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.5.jar | grep -q 'assets/eyrax_real_roosters/animations/heritage_chicken.animation.json'
          jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.5.jar | grep -q 'META-INF/neoforge.mods.toml'
          unzip -p build/libs/eyrax_real_roosters-0.3.0-alpha.5.jar META-INF/neoforge.mods.toml | grep -q 'modId="eyrax_fowl_api"'
          unzip -p build/libs/eyrax_real_roosters-0.3.0-alpha.5.jar META-INF/neoforge.mods.toml | grep -q 'modId="geckolib"'
          if unzip -Z1 build/libs/eyrax_real_roosters-0.3.0-alpha.5.jar | grep -Eq '^assets/examplemod/|^data/minecraft/tags/entity_type/'; then
            echo "Placeholder resources leaked into the main JAR"
            exit 1
          fi
          sha256sum build/libs/eyrax-fowl-api-1.0.0.jar build/libs/eyrax_real_roosters-0.3.0-alpha.5.jar
          unzip -t build/libs/eyrax-fowl-api-1.0.0.jar
          unzip -t build/libs/eyrax_real_roosters-0.3.0-alpha.5.jar
          ls -lh build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: EYRAX-Real-Roosters-0.3.0-alpha.5-build
          path: |
            visual-src/build/libs/eyrax-fowl-api-1.0.0.jar
            visual-src/build/libs/eyrax_real_roosters-0.3.0-alpha.5.jar
          if-no-files-found: error
