name: Build visual alpha source

on:
  push:
    paths:
      - "EYRAX-Real-Roosters-GeckoLib-migration-checkpoint-2026-09-03-v11.zip"
      - ".github/workflows/build-visual-alpha.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Unpack visual source
        run: |
          mkdir visual-src
          unzip -q EYRAX-Real-Roosters-GeckoLib-migration-checkpoint-2026-09-03-v11.zip -d visual-src
          test -f visual-src/build.gradle
          test -f visual-src/src/main/resources/assets/eyrax_real_roosters/geo/heritage_chicken.geo.json

      - name: Validate assets and release structure
        working-directory: visual-src
        run: |
          python3 tools/validate_gecko_assets.py
          python3 tools/validate_render_budget.py
          python3 tools/validate_release_structure.py

      - name: Build API and mod
        working-directory: visual-src
        run: gradle build --stacktrace --no-daemon

      - name: Inspect JAR separation
        working-directory: visual-src
        run: |
          test -f build/libs/eyrax-fowl-api-1.0.0.jar
          test -f build/libs/eyrax_real_roosters-0.3.0-alpha.4.jar
          jar tf build/libs/eyrax-fowl-api-1.0.0.jar | grep -q '^com/eyrax/fowlapi/'
          if jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.4.jar | grep -q '^com/eyrax/fowlapi/'; then
            echo "Fowl API classes leaked into the main JAR"
            exit 1
          fi
          jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.4.jar | grep -q 'assets/eyrax_real_roosters/geo/heritage_chicken.geo.json'
          jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.4.jar | grep -q 'assets/eyrax_real_roosters/animations/heritage_chicken.animation.json'
          jar tf build/libs/eyrax_real_roosters-0.3.0-alpha.4.jar | grep -q 'META-INF/neoforge.mods.toml'
          ls -lh build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: EYRAX-Real-Roosters-0.3.0-alpha.4-build
          path: |
            visual-src/build/libs/eyrax-fowl-api-1.0.0.jar
            visual-src/build/libs/eyrax_real_roosters-0.3.0-alpha.4.jar
          if-no-files-found: error
