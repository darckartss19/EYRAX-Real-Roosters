name: Build EYRAX Real Roosters

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EYRAX-Real-Roosters-0.2.0
          path: build/libs/*.jar
          if-no-files-found: error
